<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – FixMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="mainSidebar"></aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header -->
      <header class="top-header" id="mainHeader" data-page-title="Notification Center"></header>

      <!-- Page Content -->
      <main class="page-content">
        <div style="max-width: 850px; margin: 0 auto;">
          <!-- Title & Actions -->
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
            <div>
              <h1 style="font-size:1.5rem; font-weight:700;">System Notifications & Alerts</h1>
              <p class="text-muted" style="font-size:0.88rem;">Track real-time status changes, ticket assignments, and maintenance updates.</p>
            </div>
            <div style="display:flex; gap:0.5rem;">
              <select id="notifFilterSelect" class="form-control" style="width:auto; padding:0.4rem 0.85rem; font-size:0.85rem;">
                <option value="all">All Alerts</option>
                <option value="unread">Unread Only</option>
                <option value="read">Read Only</option>
              </select>
              <button onclick="NotificationsController.markAllRead()" class="btn btn-outline btn-sm">
                <i class="fas fa-check-double"></i> Mark All as Read
              </button>
            </div>
          </div>

          <div style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
            <span class="badge badge-medium" id="notificationsTotalCount">0 Alerts</span>
          </div>

          <!-- Notification Items List -->
          <div id="notificationsListContainer">
            <!-- Rendered dynamically via JS -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      FixMateApp.initLayout("notifications");
      NotificationsController.init();
    });
  </script>
</body>
</html>
